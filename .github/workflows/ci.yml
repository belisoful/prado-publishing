name: CI

on:
  push:
    branches: [main]
  pull_request:
  # pradosoft/prado is required at dev-master and there is no lock file, so a weekly run
  # reports an upstream change that breaks the package apart from any commit here.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    # A pinned image: a new ubuntu-latest changes the ImageMagick build the Imagick tests run on.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, imagick, zlib, dom, iconv, intl, json, ctype, exif
          coverage: xdebug

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Check the style
        run: composer style

      - name: Run the tests
        run: composer test

      - name: Report the coverage
        run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-text
